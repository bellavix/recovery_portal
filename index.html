<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAPLE Recovery Terminal</title>

<style>

body{
    margin:0;
    background:#080808;
    color:#9cff9c;
    font-family:Consolas,monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#terminal{
    width:760px;
    background:#111;
    border:2px solid #2e6d2e;
    padding:30px;
    box-shadow:0 0 20px rgba(0,255,0,.12);
}

h1{
    margin-top:0;
    letter-spacing:2px;
    color:#c5ff92;
}

p{
    line-height:1.6;
}

#prompt{
    margin-top:20px;
    line-height:1.5;
}

input{
    width:330px;
    padding:10px;
    background:#000;
    border:1px solid #3d7d3d;
    color:#9cff9c;
    font-family:Consolas,monospace;
    font-size:16px;
    margin-top:10px;
}

button{
    margin-top:18px;
    padding:10px 22px;
    background:#255d25;
    color:white;
    border:none;
    cursor:pointer;
    font-family:Consolas,monospace;
}

button:hover{
    background:#367d36;
}

#output{
    margin-top:30px;
    white-space:pre-line;
    line-height:1.6;
    min-height:170px;
}

#progress{
    display:none;
    margin-top:20px;
}

a{
    color:#c5ff92;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div id="terminal">

<h1>MAPLE RECOVERY TERMINAL</h1>

<p>

Manual Recovery Required

Recovered fragments have been verified.

To continue, identify the owner of the preserved memory archive.

</p>

<div id="prompt">

Archive Owner

</div>

<input id="input" autocomplete="off">

<br>

<button onclick="verify()">VERIFY</button>

<div id="progress">
<pre id="loading"></pre>
</div>

<div id="output"></div>

</div>

<script>

const OWNER = "BELLA";
const ARCHIVE = "A-0727";

let stage = 0;

function verify(){

    const input = document.getElementById("input");
    const value = input.value.trim().toUpperCase();

    const output = document.getElementById("output");
    const prompt = document.getElementById("prompt");

    if(stage===0){

        if(value!==OWNER){

            output.innerHTML =
            "User not found.\n\nRecovery access denied.";

            return;
        }

        output.innerHTML =
        "Owner verified.\n\nSearching available priority archives...";

        input.value="";

        stage=1;

        setTimeout(function(){

            prompt.innerHTML =
            "Archive ID<br><br>Enter the archive identifier to continue the restoration process.";

        },900);

        return;
    }

    if(stage===1){

        if(value!==ARCHIVE){

            output.innerHTML =
            "Archive not found.\n\nNo priority archive matching the provided identifier exists.\n\nRecovery cancelled.";

            return;
        }

        input.style.display="none";
        document.querySelector("button").style.display="none";

        output.innerHTML =
        "Owner verified.\n\nPriority archive located.\n\nPreparing recovery...";

        startRecovery();
    }

}

function startRecovery(){

    const progress = document.getElementById("progress");
    const loading = document.getElementById("loading");

    progress.style.display="block";

    let percent = 64;

    const interval = setInterval(function(){

        percent++;

        const filled = Math.floor((percent-64)/4);

        loading.textContent =
        "█".repeat(filled) +
        "□".repeat(9-filled) +
        " " + percent + "%";

        if(percent>=100){

            clearInterval(interval);

            progress.style.display="none";

            beginRecovery();

        }

    },140);

}

function beginRecovery(){

    const output = document.getElementById("output");

    const messages = [

"Recovering preserved memory...",

"Integrity mismatch detected.",

"Retrying...",

"Reading preserved object...",

"C0rruption detected.",

"Retrying...",

"Repairing damaged archive...",

"Generating recovery output...",

"ERROR",

"Retrying...",

"G3nerating recovery output...",

"Corruption detected.",

"Retrying...",

"Verifying restored object...",

"Corruption detected.",

"Retrying...",

"Verifying restored object...",

"...",

"Success.",

"",

"Archive Integrity: 100%",

"Recovery Status: COMPLETE",

"",

"Recovered Object",

"",

"<a href='PUT YOUR LETTER LINK HERE' target='_blank'>0727</a>"

];

    let i=0;

    const typer = setInterval(function(){

        output.innerHTML = messages.slice(0,i+1).join("<br>");

        i++;

        if(i>=messages.length){

            clearInterval(typer);

        }

    },700);

}

</script>

</body>

</html>
